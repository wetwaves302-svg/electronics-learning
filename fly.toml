# Fly.io 設定:app 名稱請在 `fly launch` 時改成你的
app = "electronics-learning"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/electronics.db"
  STATIC_DIR = "/srv/app/dist"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40
